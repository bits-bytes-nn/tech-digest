{% macro header(header) %}
<tr>
  <td style="padding-bottom: 16px">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#232F3E"
      style="
        border-radius: 8px;
        background-color: #232f3e;
        background: linear-gradient(135deg, #2c3e50 0%, #232f3e 100%);
      "
    >
      <tr>
        <td class="hero-cell" align="center" style="padding: 32px 24px">
          <img
            width="72"
            height="72"
            src="{{ header.thumbnail }}"
            alt=""
            style="border-radius: 50%; margin-bottom: 16px"
          />
          <h1
            class="hero-title"
            style="
              font-family: 'Pretendard', 'Inter', system-ui, sans-serif;
              color: #ffffff;
              font-size: 1.875rem;
              font-weight: 700;
              line-height: 1.3;
              letter-spacing: -0.02em;
              margin: 0 0 12px 0;
            "
          >
            {{ header.title }}
          </h1>
          <div
            style="
              font-family: 'Pretendard', 'Inter', system-ui, sans-serif;
              color: #d5dde5;
              font-size: 0.9375rem;
              line-height: 1.6;
              max-width: 420px;
              margin: 0 auto;
            "
          >
            {{ header.description | safe }}
          </div>
        </td>
      </tr>
    </table>
  </td>
</tr>
{% endmacro %}
