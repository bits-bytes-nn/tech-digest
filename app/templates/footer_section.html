{% macro footer(footer) %}
<tr>
  <td style="padding-top: 16px">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#FFFFFF"
      class="card-1"
      style="border-radius: 8px; background-color: #ffffff"
    >
      <tr>
        <td
          class="td-padding footer-cell"
          align="center"
          style="
            font-family: 'Pretendard', 'Inter', system-ui, sans-serif;
            color: #495057;
            font-size: 0.875rem;
            line-height: 1.6;
            padding: 24px 20px;
          "
        >
          {{ footer.title | safe }}
        </td>
      </tr>
    </table>
  </td>
</tr>
{% endmacro %}
