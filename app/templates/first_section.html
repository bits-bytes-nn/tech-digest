{% macro title(title_section) %}
<tr>
  <td style="padding-bottom: 16px">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#FFFFFF"
      class="card-1"
      style="border-radius: 8px; background-color: #ffffff"
    >
      <tr>
        <td
          class="td-padding intro-cell"
          align="center"
          style="
            font-family: 'Pretendard', 'Inter', system-ui, sans-serif;
            color: #212529;
            font-size: 1rem;
            line-height: 1.75;
            letter-spacing: -0.009em;
            font-weight: 500;
            padding: 24px 32px;
          "
        >
          {{ title_section.introduction | safe }}
        </td>
      </tr>
    </table>
  </td>
</tr>
{% endmacro %}
