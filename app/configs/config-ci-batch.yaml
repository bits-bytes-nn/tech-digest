# CI-only config used by `cdk synth` in GitHub Actions and by
# tests/test_infra_stack.py to validate that the infrastructure compiles (job
# queue, on-demand + spot compute environments, EcsEc2 container with Ref:: job
# parameters, EventBridge -> Batch target). Values are dummy placeholders, not
# real resources.
#
# It leaves vpc_id unset, so the stack creates a new VPC, the production
# topology; that works without credentials thanks to CDK_SYNTH_DUMMY_AZS=1.
resources:
  project_name: tech-digest
  stage: dev
  default_region_name: ap-northeast-2
  bedrock_region_name: us-west-2
  s3_bucket_name: tech-digest-ci-placeholder-bucket
  s3_prefix: tech-digest
  cron_expression: "cron(0 1 ? * 6 *)"

scraping:
  rss_urls:
    - "https://aws.amazon.com/blogs/machine-learning/feed/"
  days_back: 7
  min_content_length: 600

summarization:
  use_filtering: True
  filtering_criteria: all
  filtering_model_id: openai.gpt-6.1-sol
  summarization_model_id: anthropic.claude-sonnet-5-5
  greeting_model_id: anthropic.claude-haiku-5-5
  max_concurrency: 5
  min_score: 0.7
  max_posts: 3

newsletter:
  send_emails: False
  sender: "ci@example.com"
  header_title: "Weekly AI Tech Blog Digest"
