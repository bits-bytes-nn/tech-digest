# Exact versions the container image installs — generated, do not hand-edit.
#
# requirements.txt states the ranges this project is COMPATIBLE with; this file
# states what actually gets installed. Without it every `cdk deploy` re-resolved
# those ranges at build time, so the image could pick up a langchain or pydantic
# release that CI never tested, and two deploys of the same commit could ship
# different code. The base images are pinned by digest, so leaving the Python
# dependencies floating was the one unpinned layer.
#
# Resolved on the real target platform (cp312 / linux-amd64) rather than on a
# developer machine, because that is what the wheels are selected for.
#
# Regenerate after changing requirements.txt:
#
#   cd app && docker run --rm --platform linux/amd64 \
#     -v "$PWD/requirements.txt:/tmp/requirements.txt:ro" --entrypoint /bin/sh \
#     public.ecr.aws/lambda/python:3.12-x86_64 \
#     -c 'python3.12 -m pip install -q --no-cache-dir --target /tmp/site \
#         -r /tmp/requirements.txt && python3.12 -m pip list --path /tmp/site \
#         --format=freeze' | sort -f
#
