name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # The container's dependency lock is applied as a CONSTRAINTS file, so the
        # tests run against the exact versions the image ships rather than the
        # latest releases the `>=` ranges allow. aws-cdk-lib is not in the image,
        # so it is pinned in requirements.txt instead.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c app/requirements.lock
          pip install -e ".[dev]" -c app/requirements.lock

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type-check
        # The whole `app` package, entry points main.py / run_batch.py included,
        # under the one `app.*` import root the images also use.
        run: mypy app

      - name: Run tests
        # --cov-fail-under is a ratchet, not a target: keep it within a point or
        # two of actual coverage so removing tests from a covered path fails here.
        # sys.monitoring-based measurement (Python 3.12+) keeps the run fast.
        env:
          COVERAGE_CORE: sysmon
        run: >-
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=93

      - name: Filtering eval harness (dry run — no AWS, no cost)
        # Validates the eval set + analysis wiring stay healthy. The live
        # scoring pass (real Bedrock, cost) is run manually, not in CI.
        run: |
          python scripts/eval_filtering.py --eval-set all
          python scripts/eval_filtering.py --eval-set amazon

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  cdk-synth:
    name: CDK synth (validate infra)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (for AWS CDK CLI)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 20 is past end-of-life; the CDK CLI is exercised on the current LTS.
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c app/requirements.lock
          npm install -g aws-cdk@2.1139.0

      - name: CDK synth (Batch + new VPC, the production topology; no AWS creds)
        # The app makes no AWS call, so a dummy account and dummy AZs are all
        # an offline synth needs.
        run: cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: "ap-northeast-2"
          CDK_SYNTH_DUMMY_AZS: "1"
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
          CONFIG_FILE_SUFFIX: ci-batch
